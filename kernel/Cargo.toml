[package]
name = "nova-kernel"
version = "0.4.0"
edition = "2024"
description = "Project Nova: minimal x86-64 Rust kernel booted by Limine (UEFI)"
license = "MIT OR Apache-2.0"

[dependencies]
# Limine protocol structs are still hand-written (src/limine.rs).
talc = { version = "4.4", default-features = false, features = ["lock_api", "counters"] }
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "proto-dns", "socket-tcp", "socket-udp", "socket-dhcpv4", "socket-dns"] }
rustls = { version = "0.23", default-features = false, features = ["tls12"] }
# Pure-Rust crypto for rustls (experimental provider; see docs/architecture.md).
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = ["alloc", "tls12"] }
webpki-roots = "1"
# The crypto crates ask getrandom for entropy; "custom" routes it to src/rand.rs.
getrandom = { version = "0.2", features = ["custom"] }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
rhai = { version = "1.26", default-features = false, features = ["no_std", "sync"] }
sha2 = { version = "0.10", default-features = false }
spin = { version = "0.9", default-features = false, features = ["lock_api", "spin_mutex", "mutex"] }
fontdue = { version = "0.9.4", default-features = false, features = ["hashbrown"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true      # keep symbols for gdb; Limine ignores them
